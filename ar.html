<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>オリジナルマーカーARテスト</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .ar-guide {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.75);
      color: #fbbf24;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 0.85rem;
      font-weight: bold;
      z-index: 1000;
      border: 1px solid #fbbf24;
      pointer-events: none;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="ar-guide">📷 マンホールマーカーにかざしてください</div>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <!-- アップロードした pattern-marker.patt を読み込む -->
    <a-marker type="pattern" url="pattern-marker.patt">
      <!-- マーカーの上に表示するオブジェクト -->
      <a-box position="0 0.2 0" material="color: #c53030; opacity: 0.9;" depth="0.1" height="0.6" width="2"></a-box>
      <a-text value="CARP MANHOLE\nDETECTED!" position="0 0.25 0.1" align="center" color="#ffffff" width="3"></a-text>
      
      <!-- ふわふわ回る黄金の星 -->
      <a-tetrahedron position="0 1.2 0" radius="0.5" color="#fbbf24" animation="property: rotation; to: 0 360 0; loop: true; dur: 3500"></a-tetrahedron>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

</body>
</html>
