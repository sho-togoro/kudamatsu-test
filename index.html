<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>下松史跡謎解き - 花岡編</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #111827;
      color: #f3f4f6;
      font-family: sans-serif;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
    }
    .header {
      text-align: center;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 2px solid #d97706;
    }
    .title {
      font-size: 1.25rem;
      color: #fbbf24;
      font-weight: bold;
    }
    .card {
      background-color: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .stage-badge {
      display: inline-block;
      background-color: #d97706;
      color: #fff;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .story-box {
      background-color: #374151;
      border-left: 4px solid #fbbf24;
      padding: 10px;
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 12px 0;
    }
    .question-box {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fde68a;
      margin: 12px 0;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-align: center;
      margin-top: 10px;
    }
    .btn-main {
      background-color: #f59e0b;
      color: #111827;
    }
    .btn-main:active {
      background-color: #d97706;
    }
    .btn-hint {
      background-color: #374151;
      color: #9ca3af;
      border: 1px solid #4b5563;
      font-size: 0.85rem;
      padding: 10px;
    }
    .btn-hint:active {
      background-color: #4b5563;
      color: #fff;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      background-color: #111827;
      border: 1px solid #4b5563;
      color: #fff;
      border-radius: 6px;
      text-align: center;
      margin-top: 10px;
    }
    input[type="text"]:focus {
      border-color: #fbbf24;
      outline: none;
    }
    .message {
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      min-height: 24px;
      margin-top: 8px;
    }
    .msg-ok { color: #34d399; }
    .msg-ng { color: #f87171; }
    
    /* ギブアップ演出用（画面全体に星空と答えが浮かぶ） */
    .hint-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }
    .hint-crystal {
      background: #1e293b;
      border: 2px solid #fbbf24;
      box-shadow: 0 0 20px #f59e0b;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      color: #fff;
      max-width: 300px;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">下松史跡巡礼 - 花岡の謎</div>
  </div>

  <div class="card" id="app-content">
    <!-- JavaScriptでここが確実に書き換わります -->
  </div>
</div>

<!-- ギブアップ時の星降り画面 -->
<div id="hint-modal" class="hint-modal" style="display: none;">
  <div class="hint-crystal">
    <div style="font-size: 0.85rem; color: #fbbf24; margin-bottom: 8px;">🌌 妙見の星が降り立った…</div>
    <div style="font-size: 1.8rem; font-weight: bold; margin: 12px 0; color: #fff;" id="hint-word"></div>
    <div style="font-size: 0.8rem; color: #9ca3af; margin-bottom: 16px;">この答えを授かりますか？</div>
    <button class="btn btn-main" onclick="applyHintWord()">答えを入力して進む</button>
    <button class="btn btn-hint" style="margin-top: 8px;" onclick="closeHint()">閉じる</button>
  </div>
</div>

<script>
// 謎解きデータ（花岡の歴史）
var stages = [
  {
    num: "第1問",
    name: "花岡の名の起源",
    desc: "山陽道の宿場町として栄えた花岡の地にやってきた。<br>古い記録を調べるため、下のボタンを押してください。",
    story: "【和銅2年の伝承】<br>宇佐八幡宮より神霊を迎えた夜、周囲の山々が一夜にして白や紅の彩りに埋め尽くされたという。里人はこれを喜び、この地を名付けた。",
    question: "一夜にして山を埋め尽くし、地名の由来となった美しい植物とは何か？",
    answers: ["花", "はな", "ハナ"],
    correct: "花",
    hintText: "花（はな）"
  },
  {
    num: "第2問",
    name: "天下無双の大太刀",
    desc: "花岡八幡宮の杜を進むと、強烈な霊気を感じる……。<br>手がかりを調べるため、下のボタンを押してください。",
    story: "【幕末・嘉永2年の奉納】<br>国の平和と邪悪を祓うため、名工・藤原綱俊により鍛えられた全長4.65m・重さ約75kgの日本一の大太刀。その刀身に刻まれた祈りの言葉がある。",
    question: "この日本一の大太刀「〇〇の御太刀」に入る、邪気を打ち払う二文字は何か？",
    answers: ["破邪", "はじゃ", "ハジャ"],
    correct: "破邪",
    hintText: "破邪（はじゃ）"
  }
];

var currentStage = 0;
var state = "SEARCH"; // SEARCH（探索前） または RIDDLE（謎解き中）

// 画面を描画するメイン処理
function render() {
  var content = document.getElementById("app-content");
  var stage = stages[currentStage];

  // 1. 探索前の画面
  if (state === "SEARCH") {
    content.innerHTML = 
      '<span class="stage-badge">' + stage.num + '</span>' +
      '<h2 style="font-size: 1.1rem; margin-bottom: 8px;">' + stage.name + '</h2>' +
      '<p style="font-size: 0.9rem; color: #9ca3af; line-height: 1.5;">' + stage.desc + '</p>' +
      '<button class="btn btn-main" onclick="onSearchClick()">📍 周囲を探索して手がかりを得る</button>' +
      '<div id="msg" class="message"></div>';
  } 
  // 2. 謎解き中の画面
  else if (state === "RIDDLE") {
    content.innerHTML = 
      '<span class="stage-badge">' + stage.num + '</span>' +
      '<h2 style="font-size: 1.1rem; margin-bottom: 4px;">' + stage.name + '</h2>' +
      '<div class="story-box">' + stage.story + '</div>' +
      '<div class="question-box">' + stage.question + '</div>' +
      '<input type="text" id="ans-box" placeholder="答えを入力" autocomplete="off">' +
      '<button class="btn btn-main" onclick="onAnswerClick()">封印を解く</button>' +
      '<button class="btn btn-hint" onclick="openHint()">🌌 妙見の星を仰ぐ（ギブアップ・答え降臨）</button>' +
      '<div id="msg" class="message"></div>';
  }
}

// 探索ボタンを押したとき
function onSearchClick() {
  var msg = document.getElementById("msg");
  msg.className = "message msg-ok";
  msg.innerText = "周囲を探索中...";

  // 0.3秒だけ待って確実に謎解き画面に切り替える
  setTimeout(function() {
    state = "RIDDLE";
    render();
  }, 300);
}

// 解答ボタンを押したとき
function onAnswerClick() {
  var box = document.getElementById("ans-box");
  var inputVal = box.value.trim().toLowerCase();
  var msg = document.getElementById("msg");
  var stage = stages[currentStage];

  var isMatch = false;
  for (var i = 0; i < stage.answers.length; i++) {
    if (stage.answers[i].toLowerCase() === inputVal) {
      isMatch = true;
      break;
    }
  }

  if (isMatch) {
    msg.className = "message msg-ok";
    msg.innerText = "見事正解！封印が解かれた！";

    setTimeout(function() {
      if (currentStage + 1 < stages.length) {
        alert("正解！次の第2問へ進みます。");
        currentStage++;
        state = "SEARCH";
        render();
      } else {
        showClear();
      }
    }, 400);
  } else {
    msg.className = "message msg-ng";
    msg.innerText = "文字が違っているようだ…";
  }
}

// ギブアップ（ヒント表示）
function openHint() {
  document.getElementById("hint-word").innerText = stages[currentStage].correct;
  document.getElementById("hint-modal").style.display = "flex";
}

function closeHint() {
  document.getElementById("hint-modal").style.display = "none";
}

function applyHintWord() {
  closeHint();
  var box = document.getElementById("ans-box");
  if (box) {
    box.value = stages[currentStage].correct;
    onAnswerClick();
  }
}

// 全問クリア画面
function showClear() {
  var content = document.getElementById("app-content");
  content.innerHTML = 
    '<div style="text-align: center; padding: 20px 0;">' +
      '<div style="font-size: 2.5rem; margin-bottom: 10px;">🎉</div>' +
      '<h2 style="color: #fbbf24; margin-bottom: 12px;">花岡踏破・完全クリア！</h2>' +
      '<p style="font-size: 0.9rem; color: #9ca3af; line-height: 1.6; margin-bottom: 20px;">' +
        '一夜にして咲き誇った「花」の伝承と、<br>' +
        '天下無双の「破邪の御太刀」の歴史を解き明かした！' +
      '</p>' +
      '<button class="btn btn-main" onclick="location.reload()">最初からもう一度</button>' +
    '</div>';
}

// 最初の起動
render();
</script>

</body>
</html>
