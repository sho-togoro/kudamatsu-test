<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>下松史跡冒険禄 - 花岡の秘宝</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#131b2e">

  <style>
    :root {
      --bg: #0d131f;
      --panel: #1a2234;
      --panel-border: #475569;
      --gold: #f59e0b;
      --gold-glow: rgba(245, 158, 11, 0.4);
      --green: #10b981;
      --red: #ef4444;
      --text: #f1f5f9;
      --text-dim: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Kaku Gothic ProN", sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 12px;
      -webkit-tap-highlight-color: transparent;
    }
    .game-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .status-bar {
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .icon-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      background: rgba(0,0,0,0.3);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--gold);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    .svg-icon {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }
    .quest-card {
      background: var(--panel);
      border: 2px solid var(--gold);
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 0 15px var(--gold-glow);
    }
    .quest-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      border-bottom: 1px dashed var(--panel-border);
      padding-bottom: 8px;
    }
    .quest-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--gold);
    }
    .compass-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }
    .compass-icon {
      width: 32px;
      height: 32px;
      color: var(--gold);
      flex-shrink: 0;
    }
    .compass-text {
      font-size: 0.85rem;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .story-scroll {
      background: #fff8e7;
      color: #3b2a1a;
      border-radius: 6px;
      padding: 14px;
      margin-bottom: 14px;
      font-size: 0.92rem;
      line-height: 1.6;
      border-left: 5px solid #b45309;
    }
    .btn-game {
      width: 100%;
      background: #f59e0b;
      color: #0f172a;
      border: 2px solid #fef3c7;
      border-radius: 10px;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      touch-action: manipulation;
    }
    .btn-game:active {
      background: #d97706;
      transform: scale(0.98);
    }
    .btn-hint {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(245, 158, 11, 0.6);
      color: var(--gold);
      padding: 11px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 14px;
      touch-action: manipulation;
    }
    .input-field {
      width: 100%;
      background: #090d16;
      border: 2px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      font-size: 1.1rem;
      color: #fff;
      text-align: center;
      margin-bottom: 10px;
      outline: none;
    }
    .msg-feedback {
      text-align: center;
      font-size: 0.85rem;
      min-height: 20px;
      margin-top: 6px;
      font-weight: bold;
    }
    #ar-view {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .ar-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      pointer-events: none;
    }
    .ar-guide-text {
      position: absolute;
      top: 40px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--gold);
      padding: 8px 18px;
      border-radius: 20px;
      color: var(--gold);
      font-size: 0.9rem;
      font-weight: bold;
      z-index: 100001;
    }
    .falling-crystal {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(13, 19, 31, 0.95);
      border: 3px solid var(--gold);
      box-shadow: 0 0 30px #f59e0b;
      padding: 18px 30px;
      border-radius: 16px;
      color: #fff;
      font-size: 1.6rem;
      font-weight: bold;
      text-align: center;
      cursor: pointer;
      z-index: 100002;
    }
    .falling-crystal span {
      display: block;
      font-size: 0.75rem;
      color: var(--gold);
      margin-top: 6px;
    }
    .close-ar-btn {
      position: absolute;
      bottom: 40px;
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid #fff;
      color: #fff;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 100001;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="game-wrapper">
  <div class="status-bar">
    <div class="badge-group">
      <div class="icon-badge">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 0 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>
        <span>周防花岡</span>
      </div>
      <div class="icon-badge">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
        <span id="clue-counter">巻物: 0/2</span>
      </div>
    </div>
    <div style="font-size: 0.8rem; color: var(--gold); font-weight:bold;" id="stage-badge">節: 壱</div>
  </div>

  <div class="quest-card" id="quest-area">
    <div class="quest-header">
      <svg class="svg-icon" style="width:24px;height:24px;color:var(--gold);" viewBox="0 0 24 24"><path d="m6.92 5 8.49 8.49-1.42 1.41L5.5 6.41 6.92 5M3 13.91l8.49-8.49.71.71-8.49 8.49-.71-.71M21 3l-6.36 6.36 1.41 1.42L21 5.41 21 3M19.59 2.59 13.22 8.95l.71.71 6.37-6.36-.71-.71M7.91 22.09l-4.95-4.95 3.54-3.54 4.95 4.95-3.54 3.54z"/></svg>
      <div class="quest-title" id="stage-title">第一節：一夜の奇跡</div>
    </div>

    <div class="compass-box">
      <svg class="compass-icon" viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm1 17.93V17h-2v2.93A8 8 0 0 1 4.07 13H7v-2H4.07A8 8 0 0 1 11 4.07V7h2V4.07A8 8 0 0 1 19.93 11H17v2h2.93A8 8 0 0 1 13 19.93zM12 10a2 2 0 1 0 2 2 2 2 0 0 0-2-2z"/></svg>
      <div class="compass-text" id="target-desc">
        花岡の旧街道沿いに手がかりが眠っている。<br>現地で探索ボタンを押せ。
      </div>
    </div>

    <!-- 未探索画面 -->
    <div id="lock-screen">
      <button class="btn-game" id="scan-btn" type="button">
        周囲を探索して手がかりを得る
      </button>
    </div>

    <!-- 探索後の謎解き画面 -->
    <div id="unlock-screen" style="display: none;">
      <div class="story-scroll" id="story-text"></div>
      <p style="font-size:0.9rem; margin-bottom: 8px; color: var(--gold); font-weight:bold;" id="riddle-q"></p>
      <input type="text" id="answer-input" class="input-field" placeholder="答えを入力" autocomplete="off">
      <button class="btn-game" id="submit-btn" type="button">
        封印を解く
      </button>

      <button class="btn-hint" id="hint-btn" type="button">
        🌌 妙見の星を仰ぐ（ギブアップ・答えを降臨）
      </button>
    </div>

    <div class="msg-feedback" id="feedback"></div>
  </div>
</div>

<!-- カメラAR画面 -->
<div id="ar-view" style="display: none;">
  <video id="camera-video" playsinline autoplay muted></video>
  <div class="ar-overlay"></div>
  <div class="ar-guide-text">✨ 空を見上げよ…星の導きが降り注ぐ ✨</div>
  
  <div id="falling-crystal" class="falling-crystal" style="display: none;">
    <div id="crystal-text">花</div>
    <span>【タップして封印解除】</span>
  </div>

  <button class="close-ar-btn" id="close-ar-btn" type="button">戻る</button>
</div>

<script>
const STAGES = [
  {
    step: "壱",
    title: "第一節：一夜の奇跡",
    compass: "花岡の旧街道沿いに手がかりが眠っている。<br>現地で探索ボタンを押せ。",
    story: "<strong>【古文書：壱の巻】</strong><br>「和銅二年、神霊降り立ちしその夕べ、山々は突如として白や紅の彩りに覆われたり。里人は驚き、これを吉兆として地に名を残したという……」",
    riddle: "Q. 一夜にして山を埋め尽くし、この地の名の由来となったものは？",
    answers: ["花", "はな", "ハナ"],
    correctWord: "花",
    hint: "山を覆った美しい植物（漢字一文字）だ。"
  },
  {
    step: "弐",
    title: "第二節：破邪の神剣",
    compass: "八幡宮の杜深く、巨刃の霊気が漂う。<br>宝物館の気配に近づき探索せよ。",
    story: "<strong>【古文書：弐の巻】</strong><br>「幕末の動乱期、国の平安と邪気を祓うため刀工・藤原綱俊により鍛えられし神剣。刃長三米余、重さ二十貫（約75kg）に達する天下無双の大太刀あり。その刀身に刻まれし銘は、邪悪を打ち破る祈りなり……」",
    riddle: "Q. この日本一の大太刀に刻まれ、邪気を打ち払う意を持つ「二文字」とは何か？",
    answers: ["破邪", "はじゃ", "ハジャ"],
    correctWord: "破邪",
    hint: "刀の名「〇〇の御太刀」の最初の二文字だ。"
  }
];

let currentIdx = 0;
let cameraStream = null;

function updateUI() {
  const stage = STAGES[currentIdx];
  document.getElementById("stage-badge").innerText = `節: ${stage.step}`;
  document.getElementById("stage-title").innerText = stage.title;
  document.getElementById("target-desc").innerHTML = stage.compass;
  document.getElementById("story-text").innerHTML = stage.story;
  document.getElementById("riddle-q").innerText = stage.riddle;
  document.getElementById("answer-input").value = "";
  document.getElementById("feedback").innerText = "";

  document.getElementById("lock-screen").style.display = "block";
  document.getElementById("unlock-screen").style.display = "none";
}

// 探索ボタンの処理（確実に発火するようにリスナー設定）
document.getElementById("scan-btn").addEventListener("click", function() {
  const feedback = document.getElementById("feedback");
  feedback.style.color = "var(--gold)";
  feedback.innerText = "周囲を探索中...";

  setTimeout(() => {
    document.getElementById("lock-screen").style.display = "none";
    document.getElementById("unlock-screen").style.display = "block";
    document.getElementById("target-desc").innerHTML = "手がかりを発見した！<br>古文書の暗号を解読せよ。";
    document.getElementById("clue-counter").innerText = `巻物: ${currentIdx + 1}/2`;
    feedback.innerText = "";
  }, 400);
});

// 解答ボタンの処理
document.getElementById("submit-btn").addEventListener("click", function() {
  const ans = document.getElementById("answer-input").value.trim().toLowerCase();
  const feedback = document.getElementById("feedback");
  const stage = STAGES[currentIdx];

  const isCorrect = stage.answers.some(a => a.toLowerCase() === ans);

  if (isCorrect) {
    feedback.style.color = "var(--green)";
    feedback.innerText = "封印解除！古の記憶が刻まれた。";

    setTimeout(() => {
      if (currentIdx + 1 < STAGES.length) {
        alert("【見事解読！】\n第一節を突破した！\n続いて第二節、花岡八幡宮の「破邪の御太刀」へ挑め！");
        currentIdx++;
        updateUI();
      } else {
        showFinalClear();
      }
    }, 400);
  } else {
    feedback.style.color = "var(--red)";
    feedback.innerText = `違うようだ……（ヒント：${stage.hint}）`;
  }
});

// ギブアップ（カメラ起動）
document.getElementById("hint-btn").addEventListener("click", async function() {
  const arView = document.getElementById("ar-view");
  const video = document.getElementById("camera-video");
  const crystal = document.getElementById("falling-crystal");
  const crystalText = document.getElementById("crystal-text");

  crystalText.innerText = STAGES[currentIdx].correctWord;
  crystal.style.display = "none";
  arView.style.display = "flex";

  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: false
    });
    cameraStream = stream;
    video.srcObject = stream;
  } catch (err) {
    video.style.background = "#050b14";
  }

  setTimeout(() => {
    crystal.style.display = "block";
  }, 300);
});

// 結晶タップ
document.getElementById("falling-crystal").addEventListener("click", function() {
  const correct = STAGES[currentIdx].correctWord;
  closeCamera();
  document.getElementById("answer-input").value = correct;
  document.getElementById("submit-btn").click();
});

// カメラ閉じる
document.getElementById("close-ar-btn").addEventListener("click", closeCamera);

function closeCamera() {
  document.getElementById("ar-view").style.display = "none";
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
}

function showFinalClear() {
  const questArea = document.getElementById("quest-area");
  document.getElementById("clue-counter").innerText = "巻物: 2/2";
  questArea.innerHTML = `
    <div style="text-align: center; padding: 16px 8px;">
      <h2 style="color:var(--gold); font-size:1.4rem; margin-bottom:8px;">花岡踏破・満願成就！</h2>
      <p style="font-size:0.9rem; color:var(--text-dim); line-height:1.7; margin-bottom:16px;">
        一夜にして咲き誇った「花」の伝承と、<br>
        天下無双の巨刃「破邪の御太刀」の封印を解き明かした！
      </p>
      <button class="btn-game" onclick="location.reload()">最初からもう一度挑戦</button>
    </div>
  `;
}

// 起動
updateUI();
</script>

</body>
</html>
