<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>下松史跡謎解き - 花岡編 [Ver.2]</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #111827;
      color: #f3f4f6;
      font-family: sans-serif;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 400px;
    }
    .header {
      text-align: center;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 2px solid #d97706;
    }
    .title {
      font-size: 1.2rem;
      color: #fbbf24;
      font-weight: bold;
    }
    .version-tag {
      display: inline-block;
      font-size: 0.8rem;
      background-color: #d97706;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .card {
      background-color: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .stage-badge {
      display: inline-block;
      background-color: #d97706;
      color: #fff;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .story-box {
      background-color: #374151;
      border-left: 4px solid #fbbf24;
      padding: 10px;
      font-size: 0.9rem;
      line-height: 1.6;
      margin: 12px 0;
    }
    .question-box {
      font-size: 0.95rem;
      font-weight: bold;
      color: #fde68a;
      margin: 12px 0;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      text-align: center;
      margin-top: 10px;
      touch-action: manipulation;
    }
    .btn-main {
      background-color: #f59e0b;
      color: #111827;
    }
    .btn-main:active {
      background-color: #d97706;
    }
    .btn-hint {
      background-color: #374151;
      color: #fbbf24;
      border: 1px solid #f59e0b;
      font-size: 0.85rem;
      padding: 12px;
      margin-top: 14px;
    }
    .btn-hint:active {
      background-color: #4b5563;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      background-color: #111827;
      border: 1px solid #4b5563;
      color: #fff;
      border-radius: 6px;
      text-align: center;
      margin-top: 10px;
    }
    input[type="text"]:focus {
      border-color: #fbbf24;
      outline: none;
    }
    .message {
      text-align: center;
      font-size: 0.9rem;
      font-weight: bold;
      min-height: 24px;
      margin-top: 8px;
    }
    .msg-ok { color: #34d399; }
    .msg-ng { color: #f87171; }

    #camera-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0b0f17;
      z-index: 99999;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #camera-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .camera-ui-top {
      position: absolute;
      top: 24px;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid #fbbf24;
      padding: 8px 16px;
      border-radius: 20px;
      color: #fbbf24;
      font-size: 0.85rem;
      font-weight: bold;
      z-index: 10;
      text-align: center;
    }
    .camera-error-msg {
      position: absolute;
      top: 70px;
      color: #f87171;
      font-size: 0.8rem;
      background: rgba(0,0,0,0.8);
      padding: 4px 10px;
      border-radius: 4px;
      z-index: 10;
    }
    .answer-orb {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(17, 24, 39, 0.92);
      border: 3px solid #fbbf24;
      box-shadow: 0 0 25px #f59e0b, 0 0 50px #f59e0b;
      padding: 20px 32px;
      border-radius: 16px;
      color: #fff;
      text-align: center;
      z-index: 10;
      cursor: pointer;
      touch-action: manipulation;
    }
    .answer-orb .word {
      font-size: 2.2rem;
      font-weight: bold;
      color: #fbbf24;
      letter-spacing: 2px;
    }
    .answer-orb .sub {
      font-size: 0.75rem;
      color: #f3f4f6;
      margin-top: 6px;
      display: block;
    }
    .camera-close-btn {
      position: absolute;
      bottom: 30px;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid #fff;
      color: #fff;
      padding: 10px 24px;
      border-radius: 20px;
      font-size: 0.85rem;
      z-index: 10;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">
      下松史跡巡礼 - 花岡の謎
      <span class="version-tag">Ver.2</span>
    </div>
  </div>

  <div class="card" id="app-content"></div>
</div>

<!-- カメラ全画面小窓 -->
<div id="camera-modal">
  <video id="camera-video" playsinline autoplay muted></video>
  <div class="camera-ui-top">🌌 妙見の星が降臨した！</div>
  <div id="camera-err" class="camera-error-msg" style="display: none;"></div>
  
  <div class="answer-orb" onclick="applyAnswerFromCamera()">
    <div class="word" id="camera-answer-word">花</div>
    <span class="sub">【タップして答えを入力】</span>
  </div>

  <button class="camera-close-btn" onclick="closeCamera()">戻る</button>
</div>

<script>
var stages = [
  {
    num: "第1問",
    name: "花岡の名の起源",
    desc: "山陽道の宿場町として栄えた花岡の地にやってきた。<br>古い記録を調べるため、下のボタンを押してください。",
    story: "【和銅2年の伝承】<br>宇佐八幡宮より神霊を迎えた夜、周囲の山々が一夜にして白や紅の彩りに埋め尽くされたという。里人はこれを喜び、この地を名付けた。",
    question: "一夜にして山を埋め尽くし、地名の由来となった美しい植物とは何か？",
    answers: ["花", "はな", "ハナ"],
    correct: "花"
  },
  {
    num: "第2問",
    name: "天下無双の大太刀",
    desc: "花岡八幡宮の杜を進むと、強烈な霊気を感じる……。<br>手がかりを調べるため、下のボタンを押してください。",
    story: "【幕末・嘉永2年の奉納】<br>国の平和と邪悪を祓うため、名工・藤原綱俊により鍛えられた全長4.65m・重さ約75kgの日本一の大太刀。その刀身に刻まれた祈りの言葉がある。",
    question: "この日本一の大太刀「〇〇の御太刀」に入る、邪気を打ち払う二文字は何か？",
    answers: ["破邪", "はじゃ", "ハジャ"],
    correct: "破邪"
  }
];

var currentStage = 0;
var state = "SEARCH";
var videoStream = null;

function render() {
  var content = document.getElementById("app-content");
  var stage = stages[currentStage];

  if (state === "SEARCH") {
    content.innerHTML = 
      '<span class="stage-badge">' + stage.num + '</span>' +
      '<h2 style="font-size: 1.1rem; margin-bottom: 8px;">' + stage.name + '</h2>' +
      '<p style="font-size: 0.9rem; color: #9ca3af; line-height: 1.5;">' + stage.desc + '</p>' +
      '<button class="btn btn-main" onclick="onSearchClick()">📍 周囲を探索して手がかりを得る</button>' +
      '<div id="msg" class="message"></div>';
  } else if (state === "RIDDLE") {
    content.innerHTML = 
      '<span class="stage-badge">' + stage.num + '</span>' +
      '<h2 style="font-size: 1.1rem; margin-bottom: 4px;">' + stage.name + '</h2>' +
      '<div class="story-box">' + stage.story + '</div>' +
      '<div class="question-box">' + stage.question + '</div>' +
      '<input type="text" id="ans-box" placeholder="答えを入力" autocomplete="off">' +
      '<button class="btn btn-main" onclick="onAnswerClick()">封印を解く</button>' +
      '<button class="btn btn-hint" onclick="openCameraHint()">🌌 妙見の星を仰ぐ（カメラで答えを映す）</button>' +
      '<div id="msg" class="message"></div>';
  }
}

function onSearchClick() {
  var msg = document.getElementById("msg");
  msg.className = "message msg-ok";
  msg.innerText = "周囲を探索中...";

  setTimeout(function() {
    state = "RIDDLE";
    render();
  }, 250);
}

function onAnswerClick() {
  var box = document.getElementById("ans-box");
  var inputVal = box.value.trim().toLowerCase();
  var msg = document.getElementById("msg");
  var stage = stages[currentStage];

  var isMatch = false;
  for (var i = 0; i < stage.answers.length; i++) {
    if (stage.answers[i].toLowerCase() === inputVal) {
      isMatch = true;
      break;
    }
  }

  if (isMatch) {
    msg.className = "message msg-ok";
    msg.innerText = "見事正解！封印が解かれた！";

    setTimeout(function() {
      if (currentStage + 1 < stages.length) {
        alert("正解！第2問へ進みます。");
        currentStage++;
        state = "SEARCH";
        render();
      } else {
        showClear();
      }
    }, 400);
  } else {
    msg.className = "message msg-ng";
    msg.innerText = "文字が違っているようだ…";
  }
}

function openCameraHint() {
  var stage = stages[currentStage];
  document.getElementById("camera-answer-word").innerText = stage.correct;
  var modal = document.getElementById("camera-modal");
  var video = document.getElementById("camera-video");
  var errEl = document.getElementById("camera-err");

  errEl.style.display = "none";
  modal.style.display = "flex";

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    errEl.innerText = "※お使いの環境ではカメラが使えません（夜空モード）";
    errEl.style.display = "block";
    return;
  }

  navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" } },
    audio: false
  }).then(function(stream) {
    videoStream = stream;
    video.srcObject = stream;
    video.play().catch(function(e) {
      console.log("Play error:", e);
    });
  }).catch(function(err) {
    errEl.innerText = "※カメラを許可すると背景が映ります（文字タップで進めます）";
    errEl.style.display = "block";
  });
}

function closeCamera() {
  var modal = document.getElementById("camera-modal");
  modal.style.display = "none";
  if (videoStream) {
    videoStream.getTracks().forEach(function(track) {
      track.stop();
    });
    videoStream = null;
  }
}

// カメラの文字をタップしたときの処理：文字を入力するだけで止める
function applyAnswerFromCamera() {
  var correctWord = stages[currentStage].correct;
  closeCamera();
  var box = document.getElementById("ans-box");
  var msg = document.getElementById("msg");
  if (box) {
    box.value = correctWord; // 文字を入力欄に入れる
    if (msg) {
      msg.className = "message msg-ok";
      msg.innerText = "星の導きにより文字が宿った！「封印を解く」を押せ。";
    }
  }
}

function showClear() {
  var content = document.getElementById("app-content");
  content.innerHTML = 
    '<div style="text-align: center; padding: 20px 0;">' +
      '<div style="font-size: 2.5rem; margin-bottom: 10px;">🎉</div>' +
      '<h2 style="color: #fbbf24; margin-bottom: 12px;">花岡踏破・完全クリア！</h2>' +
      '<p style="font-size: 0.9rem; color: #9ca3af; line-height: 1.6; margin-bottom: 20px;">' +
        '一夜にして咲き誇った「花」の伝承と、<br>' +
        '天下無双の「破邪の御太刀」の歴史を解き明かした！' +
      '</p>' +
      '<button class="btn btn-main" onclick="location.reload()">最初からもう一度</button>' +
    '</div>';
}

render();
</script>

</body>
</html>
